# On-prem deployment:  docker compose up -d --build
#
# Copy .env.example to .env and fill in the Supabase values first — the app refuses to start
# serving data without them.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: it-asset-management:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    # Chromium renders in memory and uses /dev/shm for shared memory. The Docker default of
    # 64 MB is not enough; 1 GB keeps multi-page register rendering stable.
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
